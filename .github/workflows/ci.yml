# CI runs exactly `pnpm verify`, so the stages live in one place (scripts/verify.mjs) and a green
# local `pnpm verify` is the same evidence as a green run here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Every push and every pull request is verified, each commit once: a pull request from a branch
    # of this repo is already covered by the push run on the same commit, so only fork pull
    # requests run here as `pull_request`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, for the gitleaks stage slice 0 adds (it scans every commit).
          fetch-depth: 0
          persist-credentials: false

      # No `version` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `node-version-file: package.json` resolves `engines.node`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      # No separate install step: verify's first stage is `pnpm install --frozen-lockfile`, so the
      # run here is stage for stage the run on a laptop. Docker is preinstalled on the runner: the
      # docker stage checks it, Testcontainers (slice 1) and gitleaks (slice 0) use it.
      - run: pnpm verify
