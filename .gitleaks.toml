# gitleaks configuration for the `secrets` stage of `pnpm verify` (scripts/secret-scan.mjs).
# The default ruleset plus one rule per secret this project handles. Valid in gitleaks v8.30.1.

[extend]
useDefault = true

[[rules]]
id = "resend-api-key"
description = "Resend API key (re_ prefix)"
regex = '''\bre_[A-Za-z0-9_]{20,}'''

[[rules]]
id = "resend-webhook-secret"
description = "Resend webhook signing secret (whsec_ prefix)"
regex = '''\bwhsec_[A-Za-z0-9+/]{20,}={0,2}'''

[[rules]]
id = "ledger-api-token"
description = "Ledger API token (ldg_ prefix, random part and tag)"
regex = '''ldg_[0-9a-f]{64}_[0-9a-f]{64}'''

[[rules]]
id = "postgres-url"
description = "Postgres connection URL that carries a password"
regex = '''postgres(?:ql)?://[^\s:/@]+:[^\s@/]+@[^\s/:?#'"`)>]+'''
# The compose and Testcontainers throwaway credentials only ever point at the local host. Anchored
# at the end of the match (which stops before any `:port` or `/db`, and before a closing quote,
# backtick, `)` or `>`, so a quoted local URL with no port still matches), so a host that merely
# starts with `localhost.` or `127.0.0.1.` is still reported. `@` and `,` stay in the host class:
# `@localhost@prod` and `@localhost,prod` name another host and are reported.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''@(?:localhost|127\.0\.0\.1)$''']

# Two pushed branch commits wrote fake test fixtures as literals, against the run-time convention
# (packages/ingest/src/create-ingest.test.ts): in 13ab103 the base64 of the ASCII string
# "simulator-test-secret" behind a whsec_ prefix, twice; in ef11982 the counting hex string
# 0123456789abcdef four times as a hash key. History is not rewritten (no force-push), so exactly
# these two commits, three files and two rules are excused. The same files in any other commit,
# and every other file or rule in these commits, are still scanned; a later commit builds the
# values at run time.
[[allowlists]]
description = "Fake test fixtures committed as literals in two slice 1 branch commits"
condition = "AND"
targetRules = ["resend-webhook-secret", "generic-api-key"]
commits = ["13ab103681c264cd5e9d0f255eff03b81353392a", "ef11982ed74e37b01ebc8013a31d0ccec25fc118"]
paths = [
  '''^sim/src/main\.e2e\.test\.ts$''',
  '''^sim/src/sim\.config\.test\.ts$''',
  '''^apps/local/src/main\.e2e\.test\.ts$''',
]

# The same slip in two pushed slice 2 branch commits: in 1a42b28 a credentialed Postgres URL to
# db.example in an error-message test; in 4aea5c0 a fake whsec_ value (base64 of
# "fakeWebhookSecret5" and of "fake") and owner URLs to *.db.invalid hosts in the deploy and
# template-scan tests. Owner-approved 2026-10-18. Exactly these two commits, three files and three
# rules are excused; 50c94da builds the values at run time.
[[allowlists]]
description = "Fake test fixtures committed as literals in two slice 2 branch commits"
condition = "AND"
targetRules = ["postgres-url", "resend-webhook-secret", "generic-api-key"]
commits = ["1a42b283647aea9b2424615d64534e43ff65e166", "4aea5c029fcebaa7cfa002d9deb56adc56a0ba94"]
paths = [
  '''^apps/api/src/create-api-handler\.test\.ts$''',
  '''^infra/scripts/run-deploy\.test\.ts$''',
  '''^infra/scripts/template-secrets\.test\.ts$''',
]
